name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ant_marine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ant_marine_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      RAILS_ENV: test
      ANT_MARINE_DB_HOST: localhost
      ANT_MARINE_DB_PORT: 5432
      ANT_MARINE_DB_USER: postgres
      ANT_MARINE_DB_PASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install native packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Bundle check
        run: bundle check

      - name: Prepare test database
        run: bin/rails db:prepare

      - name: Zeitwerk check
        run: bin/rails zeitwerk:check

      - name: Build Tailwind CSS
        run: bin/rails tailwindcss:build

      - name: Rails tests
        run: bin/rails test

      - name: RuboCop
        run: bin/rubocop -f github

      - name: Brakeman
        run: bin/brakeman -q --no-pager

      - name: Bundler audit
        run: bin/bundler-audit check

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan importmap JavaScript dependencies
        run: bin/importmap audit