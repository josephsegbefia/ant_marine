function field(label,value='',type='text',required=false,key=''){const id=key||label.toLowerCase().replace(/[^a-z]/g,'-'); if(type==='textarea')return `<div class="field-wrap"><label for="field-${id}">${esc(label)}${required?' *':''}</label><textarea class="control" id="field-${id}" data-save="${id}" placeholder="${esc(value)}">${esc(demoForm[id]||'')}</textarea></div>`;if(type==='select')return `<div class="field-wrap"><label for="field-${id}">${esc(label)}${required?' *':''}</label><select class="control" id="field-${id}" data-save="${id}"><option>${esc(demoForm[id]||value||'Choose one')}</option>${['Marine survey','Project support','Environmental assessment','Naval design & modification','Technical reporting','Training','Other'].filter(x=>x!==value).map(x=>`<option>${x}</option>`).join('')}</select></div>`;return `<div class="field-wrap"><label for="field-${id}">${esc(label)}${required?' *':''}</label><input id="field-${id}" class="control" data-save="${id}" type="${type}" value="${esc(demoForm[id]??'')}" placeholder="${esc(value)}" ${required?'required':''}/></div>`;}

function galleryCard(s){const sc=galleryScale(s),w=s.viewport.width,h=s.viewport.height;return `<div class="gallery-card" role="button" tabindex="0" data-select="${s.id}"><div class="gallery-thumbnail"><div class="frame-canvas" style="width:${w}px;height:${h}px;transform:scale(${sc})">${shell(s)}</div></div><div class="gallery-caption"><div><strong>${esc(s.title)}</strong><small>${s.id} · ${s.group}</small></div><span class="gallery-chip">${s.phase}</span></div></div>`;}
function galleryResults(){return screens.filter(s=>(groupFilter==='All screens'||s.group===groupFilter)&&(s.id+' '+s.title+' '+s.group+' '+s.purpose).toLowerCase().includes(searchTerm));}
function renderStage(){const stage=document.getElementById('stage'),s=byId[current];document.getElementById('studio-current').textContent=`${s.id} · ${s.title}`;document.getElementById('studio-count').textContent=`${screens.length} screens · ${s.group} · ${s.phase}`;if(gallery){const matches=galleryResults();stage.innerHTML=`<div class="gallery"><div class="gallery-top"><div>Browse ${matches.length} screens · Choose a card to open it</div><label>Show <select id="gallery-group">${['All screens',...groups].map(x=>`<option ${x===groupFilter?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="gallery-grid">${matches.slice(0,40).map(galleryCard).join('')}</div>${matches.length>40?`<p style="font-size:12px;color:#6b8794;margin:19px 0">Showing the first 40 matching screens. Choose a category or search to see the others.</p>`:''}</div>`;}else{let sc=computeScale(s);stage.innerHTML=`<div class="preview animate-in"><div class="preview-top"><span>${s.id} / ${s.group} · ${s.phase}</span><span>${s.viewport.width} × ${s.viewport.height} · ${Math.round(sc*100)}% preview</span></div>${frame(s,sc)}<div class="preview-bottom">Click the preview to explore it. All actions are examples; nothing is sent or saved to a server.</div></div>`;}}
function renderInspector(){const s=byId[current],r=getReview(current),counts=stateCounts();const el=document.getElementById('inspector');el.innerHTML=`<div class="inspector"><h2>Screen details</h2><p class="inspector-sub">Use this guide to review the screen and hand off clear decisions before development.</p><div class="meta-pills"><span class="meta-pill">${s.id}</span><span class="meta-pill">${s.phase}</span><span class="meta-pill">${s.group}</span></div><div class="inspect-heading">What this screen does</div><p class="inspect-p">${esc(s.purpose)}</p><div class="inspect-heading">Who can see it</div><p class="inspect-p">${esc(s.who)}</p><div class="inspect-heading">Main next step</div><p class="inspect-p">${esc(s.primary)}</p><div class="inspect-heading">Preview size</div><div class="inspect-mini"><span>Screen</span><b>${s.viewport.width} × ${s.viewport.height}</b></div><div class="inspect-mini"><span>Layout</span><b>${s.group==='Mobile previews'?'Phone':'Desktop'}</b></div><div class="inspect-heading">Things to remember</div><ul>${(s.buildNotes||[]).map(n=>`<li>${esc(n)}</li>`).join('')}</ul><div class="inspect-heading">Other situations to design</div><div class="meta-pills">${s.states.map(x=>`<span class="meta-pill">${x}</span>`).join('')}</div><div style="margin-top:15px"><label style="font-size:11px;font-weight:750;color:#516c7b;display:block;margin-bottom:7px" for="preview-state">See another screen condition</label><select id="preview-state" style="width:100%;padding:10px;border:1px solid #dbe6e9;border-radius:9px;font-size:11px">${s.states.map(x=>`<option ${x===previewState?'selected':''}>${x}</option>`).join('')}</select></div><hr class="inspect-rule"><h2 style="font-size:14px">Design review</h2><div class="review-buttons">${[['draft','Needs review'],['changes','Needs changes'],['approved','Approved']].map(x=>`<button class="${r.status===x[0]?'active':''}" data-review="${x[0]}">${x[1]}</button>`).join('')}</div><div class="inspect-heading">Notes for the next build</div><textarea id="review-note" class="note-textarea" placeholder="What should change? What must be kept?">${esc(r.note)}</textarea><div class="inspector-btns"><button class="st-btn primary" data-studio="export">${icon('download',14)} Export design review</button><button class="st-btn" data-studio="brief">${icon('clipboard',14)} Copy this screen's brief</button><button class="st-btn" data-studio="import">${icon('upload',14)} Import earlier review</button></div><div class="inspect-heading">Review progress</div><p class="inspect-p">${counts.approved} approved · ${counts.changes} need changes · ${screens.length} screens in total</p><p class="inspector-sub" style="margin-top:14px">Your notes stay in this browser. Export them to share or keep a permanent copy.</p></div>`;}
function pick(id){if(!byId[id])return;current=id;gallery=false;previewState='Normal';document.getElementById('single-mode')?.classList.add('active');document.getElementById('gallery-mode')?.classList.remove('active');renderNav();renderStage();renderInspector();const nav=document.querySelector(`.nav-item[data-select="${id}"]`);nav?.scrollIntoView({block:'nearest'});try{history.replaceState(null,'',location.pathname+location.search+'#'+id)}catch(e){};}
function setGallery(on){gallery=on;document.getElementById('gallery-mode').classList.toggle('active',on);document.getElementById('single-mode').classList.toggle('active',!on);renderStage();}
function exportReviews(){let data={product:'ANT Marine W.A. — Design Studio',version:STUDIO_VERSION,generatedAt:new Date().toISOString(),designRules:{colors:{navy:'#102C43',teal:'#25877F',seaBlue:'#4A7F9A',sky:'#EAF4F7',sand:'#F8F4ED',canvas:'#F6F8F8'},layout:{desktop:'1440 × 900',mobile:'390 × 844',spacing:'8px rhythm'},frontEnd:'Rails views with Hotwire and Stimulus',accessibility:['Keyboard access','Visible focus','Readable contrast','Reduced motion support'],content:'Everyday English and approved maritime service terminology'},screens:screens.map(s=>({...s,review:getReview(s.id)}))};download(JSON.stringify(data,null,2),'ant-marine-design-review.json','application/json');notify('Design review exported.');}
function download(text,name,mime='text/plain'){let blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function briefText(s){return `${s.id} — ${s.title}\nGroup: ${s.group}\nWho can see it: ${s.who}\nPurpose: ${s.purpose}\nMain action: ${s.primary}\nDesign notes:\n${s.buildNotes.map(n=>'- '+n).join('\n')}\nReview: ${getReview(s.id).status}\nReview notes: ${getReview(s.id).note||'None'}`;}
function copyBrief(){const s=byId[current],val=briefText(s);if(navigator.clipboard?.writeText)navigator.clipboard.writeText(val).then(()=>notify('Screen brief copied.')).catch(()=>{download(val,'ant-marine-screen-'+s.id+'.txt');notify('Clipboard unavailable. Saved a text copy instead.')});else{download(val,'ant-marine-screen-'+s.id+'.txt');notify('Saved the screen brief.')}}
function fullPreview(){let url=new URL(location.href);url.searchParams.set('preview',current);url.hash='';window.open(url.toString(),'_blank','noopener,noreferrer');}
function showModal(title,desc,next=''){const host=document.querySelector('.prototype #screen-modal-host');if(!host)return;host.innerHTML=`<div class="screen-modal"><div class="modal-card" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2><p>${esc(desc)}</p><div class="modal-actions"><button class="btn outline" data-action="Close dialog">Cancel</button><button class="btn" data-confirm="${esc(next)}">Continue ${icon('arrow',14)}</button></div></div></div>`;}
function handleDemoAction(action){if(action==='Close dialog'){document.querySelector('.prototype #screen-modal-host').innerHTML='';return;}
if(/choose files|upload file|upload document|add a photograph|add photographs/i.test(action)){const inp=document.getElementById('demo-file-input');inp.value='';inp.click();return;}
if(action==='Accept quotation'){showModal('Accept quotation?','This is a design preview. Accepting would confirm the quotation and start the agreed project. No real acceptance will be recorded.','C06');return;}
if(action==='Approve report'){showModal('Approve this report?','In the real app, approval is recorded with the reviewer and time. The client cannot see it until it is released.','S14');return;}
if(action==='Release to client'){showModal('Release report to the client?','The approved file will become available to the correct client company. This preview does not send a notification or release any real file.','C12');return;}
if(action==='Send for approval'){showModal('Send for review?','A reviewer would receive this draft and decide whether it is ready to share. Nothing is sent in this preview.','S05');return;}
if(/^download/i.test(action)){download('ANT Marine W.A. — illustrative preview file.\nNo real report, invoice or client file is included.\n','ant-marine-sample-download.txt');notify('Downloaded a sample text file (not a real report).');return;}
if(/^(Send|Reply)/i.test(action)){notify('This is a design preview. Nothing was sent.');return;}
if(/^(Save|Mark)/i.test(action)){notify('This preview shows how saving will work. No server change was made.');return;}
if(action==='Open menu'){showModal('Menu','Use the tabs at the bottom to open another page. This is a compact phone layout.','');return;}
notify(`${action} — example interaction only. No live change was made.`);}
function renderFullView(){const qp=new URLSearchParams(location.search),id=qp.get('preview');if(!id||!byId[id])return false;document.body.classList.add('full-preview');document.getElementById('studio').style.display='none';document.getElementById('full-root').style.display='block';function show(id){const s=byId[id];if(!s)return;current=id;previewState='Normal';const root=document.getElementById('full-root');root.innerHTML=`<div style="background:#17384a;color:white;padding:12px 20px;font-size:12px;display:flex;justify-content:space-between;align-items:center"><b>ANT Marine · ${s.id} · ${s.title}</b><button class="st-btn" id="close-full">Back to design studio</button></div><div style="display:flex;justify-content:center;padding:20px;min-height:calc(100vh - 58px);overflow:auto"><div style="box-shadow:0 18px 55px #0002;flex:none">${shell(s)}</div></div>`;document.getElementById('close-full').onclick=()=>{let u=new URL(location.href);u.searchParams.delete('preview');u.hash=s.id;location.href=u.toString()};}show(id);window.__showFull=show;return true;}
function eventClick(e){const select=e.target.closest('[data-select]');if(select){pick(select.dataset.select);return;}
const review=e.target.closest('[data-review]');if(review){reviews[current]={...getReview(current),status:review.dataset.review};persist();renderNav();renderInspector();return;}
const studioAction=e.target.closest('[data-studio]');if(studioAction){if(studioAction.dataset.studio==='export')exportReviews();if(studioAction.dataset.studio==='brief')copyBrief();if(studioAction.dataset.studio==='import')document.getElementById('review-import-file').click();return;}
const grp=e.target.closest('[data-go]');if(grp){const dest=grp.dataset.go;if(window.__showFull)window.__showFull(dest);else pick(dest);return;}
const confirm=e.target.closest('[data-confirm]');if(confirm){const dest=confirm.dataset.confirm;if(window.__showFull){document.querySelector('.prototype #screen-modal-host').innerHTML='';if(dest)window.__showFull(dest);}else{document.querySelector('.prototype #screen-modal-host').innerHTML='';if(dest)pick(dest);else notify('Example step confirmed in preview.')}return;}
const tab=e.target.closest('[data-tab]');if(tab){tab.parentElement.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));tab.classList.add('active');notify('Showing sample '+tab.textContent.trim().toLowerCase()+' items.');return;}
const action=e.target.closest('[data-action]');if(action){handleDemoAction(action.dataset.action);return;}}
function setup(){const full=renderFullView();document.addEventListener('click',eventClick);
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-go],[role="button"][data-select]')){e.preventDefault();e.target.click();}if(e.key==='Escape'){const h=document.querySelector('.prototype #screen-modal-host');if(h)h.innerHTML='';}if(e.target.closest('input,textarea,select'))return;if(!full&&e.key==='ArrowRight')document.getElementById('next').click();if(!full&&e.key==='ArrowLeft')document.getElementById('prev').click();});
document.addEventListener('input',e=>{if(e.target.id==='review-note'){reviews[current]={...getReview(current),note:e.target.value.slice(0,12000)};persist();return;}if(e.target.id==='search'){searchTerm=e.target.value.toLowerCase().trim();renderNav();if(gallery)renderStage();return;}if(e.target.dataset.save){demoForm[e.target.dataset.save]=e.target.value;return;}if(e.target.dataset.filterInput!==undefined){const card=e.target.closest('.card,.app-table-card');if(!card)return;const q=e.target.value.toLowerCase();card.querySelectorAll('tbody tr,.list-item').forEach(row=>{row.style.display=row.textContent.toLowerCase().includes(q)?'':'none';});}});
document.addEventListener('change',async e=>{if(e.target.id==='gallery-group'){groupFilter=e.target.value;renderStage();return;}if(e.target.id==='preview-state'){previewState=e.target.value;renderStage();return;}if(e.target.id==='demo-file-input'){const files=[...e.target.files];if(files.length)notify(`${files.length} file${files.length===1?'':'s'} selected for preview. Nothing was uploaded.`);return;}if(e.target.id==='review-import-file'){const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.product!=='ANT Marine W.A. — Design Studio'||!Array.isArray(data.screens))throw Error('This file was not exported from the ANT Marine studio');for(const row of data.screens){const r=row.review||row;if(byId[row.id]&&['draft','changes','approved'].includes(r.status))reviews[row.id]={status:r.status,note:String(r.note||'').slice(0,12000)};}persist();renderNav();renderInspector();notify('Your earlier review was imported.');}catch(err){notify('Could not import this review: '+err.message)}e.target.value='';}});
if(full)return;
document.getElementById('single-mode').onclick=()=>setGallery(false);document.getElementById('gallery-mode').onclick=()=>setGallery(true);document.getElementById('prev').onclick=()=>{let i=screens.findIndex(s=>s.id===current);pick(screens[(i-1+screens.length)%screens.length].id)};document.getElementById('next').onclick=()=>{let i=screens.findIndex(s=>s.id===current);pick(screens[(i+1)%screens.length].id)};document.getElementById('export-top').onclick=exportReviews;document.getElementById('full-open').onclick=fullPreview;window.addEventListener('resize',()=>{if(!gallery)renderStage()});pick(byId[location.hash.slice(1)]?location.hash.slice(1):'G01');}
setup();
</script>
</body></html>
