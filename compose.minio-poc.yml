# Isolated MinIO for encrypted S3 PoC only — NOT production Hetzner.
# Usage: docker compose -f compose.minio-poc.yml up -d
services:
  minio:
    image: minio/minio:latest
    container_name: ant_marine_minio_poc
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ant_marine_minio_poc
      MINIO_ROOT_PASSWORD: minio-poc-local-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ant_marine_minio_poc:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 ant_marine_minio_poc minio-poc-local-only;
      mc mb --ignore-existing local/ant-marine-encrypted-poc;
      mc anonymous set none local/ant-marine-encrypted-poc;
      exit 0;
      "

volumes:
  ant_marine_minio_poc: