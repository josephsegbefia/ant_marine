test:
  service: EncryptedDisk
  root: <%= Rails.root.join("tmp/storage") %>

local_encrypted:
  service: EncryptedDisk
  root: <%= Rails.root.join("storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Plain S3 — does NOT apply application-side encryption. Confidential production
# files must use an encrypted adapter (future EncryptedS3Service) or local_encrypted.
# Boot is blocked in production when this service is selected (see Storage::ProductionServiceGate).
# Local MinIO PoC only — requires compose.minio-poc.yml. Application-side encryption.
encrypted_s3:
  service: EncryptedS3
  access_key_id: <%= ENV.fetch("MINIO_POC_ACCESS_KEY", "ant_marine_minio_poc") %>
  secret_access_key: <%= ENV.fetch("MINIO_POC_SECRET_KEY", "minio-poc-local-only") %>
  region: <%= ENV.fetch("MINIO_POC_REGION", "us-east-1") %>
  bucket: <%= ENV.fetch("MINIO_POC_BUCKET", "ant-marine-encrypted-poc") %>
  endpoint: <%= ENV.fetch("MINIO_POC_ENDPOINT", "http://127.0.0.1:9000") %>
  force_path_style: true
  upload:
    acl: "private"

private_s3:
  service: S3
  access_key_id: <%= ENV["STORAGE_S3_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["STORAGE_S3_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("STORAGE_S3_REGION", "eu-central") %>
  bucket: <%= ENV["STORAGE_S3_BUCKET"] %>
  endpoint: <%= ENV["STORAGE_S3_ENDPOINT"] %>
  force_path_style: <%= ENV.fetch("STORAGE_S3_FORCE_PATH_STYLE", "true") %>
  upload:
    acl: "private"