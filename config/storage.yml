test:
  service: EncryptedDisk
  root: <%= Rails.root.join("tmp/storage") %>

local_encrypted:
  service: EncryptedDisk
  root: <%= Rails.root.join("storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

private_s3:
  service: S3
  access_key_id: <%= ENV["STORAGE_S3_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["STORAGE_S3_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("STORAGE_S3_REGION", "eu-central") %>
  bucket: <%= ENV["STORAGE_S3_BUCKET"] %>
  endpoint: <%= ENV["STORAGE_S3_ENDPOINT"] %>
  force_path_style: <%= ENV.fetch("STORAGE_S3_FORCE_PATH_STYLE", "true") %>
  upload:
    acl: "private"